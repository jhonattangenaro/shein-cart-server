<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 SHEIN Cart Viewer</title>
  <style>
    :root {
      --bg-primary: #f5f5f7;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-muted: #86868b;
      --border: #d2d2d7;
      --accent: #ff2d55;
      --accent-hover: #e0264a;
      --success: #34c759;
      --error: #ff3b30;
      --warning: #ff9500;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-hover: 0 4px 20px rgba(0,0,0,0.12);
      --sku-bg: #f0f0f5;
      --badge-bg: #fff0f3;
      --badge-text: #ff2d55;
      --btn-secondary-bg: #f5f5f7;
      --btn-secondary-border: #d2d2d7;
      --btn-secondary-text: #1d1d1f;
      --hist-bg: #ffffff;
      --hist-border: #e5e5ea;
      --btn-danger-bg: #fff0f0;
      --btn-danger-border: #ffd0d0;
      --btn-danger-text: #ff3b30;
    }

    [data-theme="dark"] {
      --bg-primary: #0f0f0f;
      --bg-card: #1c1c1e;
      --bg-input: #2c2c2e;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-muted: #6e6e73;
      --border: #38383a;
      --accent: #ff375f;
      --accent-hover: #ff5a7a;
      --success: #30d158;
      --error: #ff453a;
      --warning: #ff9f0a;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --shadow-hover: 0 4px 20px rgba(0,0,0,0.5);
      --sku-bg: #2c2c2e;
      --badge-bg: #3d1a22;
      --badge-text: #ff375f;
      --btn-secondary-bg: #2c2c2e;
      --btn-secondary-border: #38383a;
      --btn-secondary-text: #f5f5f7;
      --hist-bg: #1c1c1e;
      --hist-border: #38383a;
      --btn-danger-bg: #3d1a1a;
      --btn-danger-border: #5c2a2a;
      --btn-danger-text: #ff6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 4px;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 14px 6px 10px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.3s;
      user-select: none;
    }
    .theme-toggle:hover { box-shadow: var(--shadow-hover); }
    .theme-toggle .icon {
      font-size: 20px;
      transition: transform 0.3s;
    }
    .theme-toggle:hover .icon { transform: rotate(20deg); }
    .theme-toggle .label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: background 0.3s, border-color 0.3s;
    }
    .card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .url-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .url-row input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      background: var(--bg-input);
      color: var(--text-primary);
      transition: border-color 0.2s, background 0.3s;
    }
    .url-row input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .url-row input::placeholder { color: var(--text-muted); }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--btn-secondary-border);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--border);
    }
    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-danger {
      background: var(--btn-danger-bg);
      color: var(--btn-danger-text);
      border: 1px solid var(--btn-danger-border);
      font-size: 13px;
      padding: 8px 14px;
    }
    .btn-danger:hover {
      background: var(--btn-danger-border);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .status {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 14px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .status.show { display: flex; }
    .status.loading { background: #e8f4fd; color: #0066cc; }
    .status.success { background: #e8f8ee; color: #1a7f37; }
    .status.error { background: #fde8e8; color: #c41e1e; }
    [data-theme="dark"] .status.loading { background: #1a2d3d; color: #6db3f8; }
    [data-theme="dark"] .status.success { background: #1a3d2a; color: #5dd87a; }
    [data-theme="dark"] .status.error { background: #3d1a1a; color: #f86d6d; }

    .summary {
      display: flex;
      gap: 24px;
      padding: 16px 20px;
      background: var(--bg-primary);
      border-radius: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .summary-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .summary-item .value {
      font-size: 18px;
      font-weight: 700;
    }
    .summary-item .value.total { color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .product {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }
    .product:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }
    .product.sold-out { opacity: 0.55; filter: grayscale(0.7); }
    .product.sold-out .product-img { opacity: 0.6; }
    .product-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background: var(--bg-primary);
    }
    .product-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .product-number {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .product-price {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    .product-price .old {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: line-through;
      font-weight: 400;
      margin-left: 6px;
    }
    .product-price .discount {
      display: inline-block;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 6px;
      font-weight: 600;
    }
    .product-name {
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-primary);
      font-weight: 500;
    }
    .product-variant {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .product-sku {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--sku-bg);
      padding: 6px 10px;
      border-radius: 8px;
      margin-top: 4px;
    }
    .product-status {
      font-size: 12px;
      color: var(--warning);
      font-style: italic;
    }
    .sold-badge {
      margin-top: 6px;
      background: var(--btn-danger-bg);
      color: var(--btn-danger-text);
      border: 1px solid var(--btn-danger-border);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      text-align: center;
    }
    .product-link {
      display: block;
      text-align: center;
      padding: 10px;
      margin: 0 16px 16px;
      background: var(--text-primary);
      color: var(--bg-card);
      text-decoration: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .product-link:hover { opacity: 0.85; }

    .btn-copy {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--btn-secondary-border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy:hover { background: var(--border); }

    .hist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .hist-header h2 { margin-bottom: 0; }
    .hist-list { display: flex; flex-direction: column; gap: 8px; }
    .hist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--hist-bg);
      border: 1px solid var(--hist-border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      gap: 12px;
    }
    .hist-item:hover {
      background: var(--bg-primary);
      border-color: var(--accent);
    }
    .hist-item .url {
      font-size: 13px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .hist-item .meta {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .hist-empty {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-primary);
      color: var(--bg-card);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    @media (max-width: 600px) {
      .header { flex-direction: column; gap: 12px; align-items: flex-start; }
      .url-row { flex-direction: column; }
      .actions { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
      .summary { gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>🛒 SHEIN Cart Viewer</h1>
        <p>Extrae y formatea los datos de carritos compartidos</p>
      </div>
      <div class="theme-toggle" id="themeToggle" title="Cambiar tema">
        <span class="icon" id="themeIcon">🌙</span>
        <span class="label" id="themeLabel">Oscuro</span>
      </div>
    </div>

    <div class="card">
      <h2>🔗 Enlace del carrito</h2>
      <div class="url-row">
        <input type="text" id="url" placeholder="https://onelink.shein.com/... o https://m.shein.com/...">
        <button class="btn btn-primary" id="btnConsultar" onclick="consultar()">
          🔍 Consultar
        </button>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="btnExcel" onclick="copiarExcel()" disabled>
          📊 Copiar Todo (Excel)
        </button>
        <button class="btn btn-secondary" id="btnJson" onclick="exportarJson()" disabled>
          ⬇️ Exportar JSON
        </button>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="card" id="resultsCard" style="display:none">
      <h2>📦 Productos</h2>
      <div class="summary" id="summary"></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="card">
      <div class="hist-header">
        <h2>🕐 Historial de consultas</h2>
        <button class="btn btn-danger" id="btnClearHist" onclick="limpiarHistorial()" style="display:none">
          🗑️ Limpiar historial
        </button>
      </div>
      <div id="histList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let ultimo = null;

    function initTheme() {
      const saved = localStorage.getItem('shein-theme');
      const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(theme);
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('shein-theme', theme);
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        label.textContent = 'Claro';
      } else {
        icon.textContent = '🌙';
        label.textContent = 'Oscuro';
      }
    }
    document.getElementById('themeToggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });
    initTheme();

    function setStatus(type, msg) {
      const el = document.getElementById('status');
      el.className = 'status show ' + type;
      el.textContent = msg;
    }
    function hideStatus() {
      document.getElementById('status').className = 'status';
    }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function consultar() {
      const url = document.getElementById('url').value.trim();
      if (!url) { setStatus('error', '⚠️ Pega un enlace de SHEIN.'); return; }

      const btn = document.getElementById('btnConsultar');
      btn.disabled = true;
      hideStatus();
      setStatus('loading', '⏳ Consultando carrito... (puede tardar hasta 90s)');
      document.getElementById('resultsCard').style.display = 'none';
      document.getElementById('btnExcel').disabled = true;
      document.getElementById('btnJson').disabled = true;

      fetch('/api/cart', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      })
      .then(r => r.json())
      .then(data => {
        btn.disabled = false;
        if (!data.ok) {
          setStatus('error', '❌ ' + (data.error || 'Error desconocido.'));
          return;
        }
        ultimo = data;
        render(data);
        guardarHistorial(data);
        document.getElementById('btnExcel').disabled = false;
        document.getElementById('btnJson').disabled = false;
        const agotados = (data.items || []).filter(it => it.outOfStock).length;
        setStatus('success', `✅ ${data.itemsCount} productos${agotados ? ` (${agotados} agotados)` : ''} · Total disponible $${(data.total||0).toFixed(2)} · ${data.ms ? Math.round(data.ms/1000)+'s' : ''}`);
      })
      .catch(err => {
        btn.disabled = false;
        setStatus('error', '❌ Error de red: ' + err.message);
      });
    }

    function render(data) {
      document.getElementById('resultsCard').style.display = 'block';

      document.getElementById('summary').innerHTML = `
        <div class="summary-item">
          <span class="label">Compartido por</span>
          <span class="value">${esc(data.sharedBy || '—')}</span>
        </div>
        <div class="summary-item">
          <span class="label">Productos</span>
          <span class="value">${data.itemsCount || 0}</span>
        </div>
        <div class="summary-item">
          <span class="label">Total</span>
          <span class="value total">$${(data.total || 0).toFixed(2)}</span>
        </div>
      `;

      const grid = document.getElementById('grid');
      if (!data.items || !data.items.length) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>No hay productos disponibles.</p></div>';
        return;
      }

      grid.innerHTML = data.items.map((it, i) => `
        <div class="product ${it.outOfStock ? 'sold-out' : ''}">
          <img class="product-img" src="${it.img || ''}" alt="${esc(it.name)}" onerror="this.style.display='none'">
          <div class="product-body">
            <div class="product-header">
              <span class="product-number">#${i+1}</span>
              <button class="btn-copy" onclick="copiarItem(${i})">📋 Copiar</button>
            </div>
            <div class="product-price">
              $${(it.price || 0).toFixed(2)}
              ${it.originalPrice ? `<span class="old">$${it.originalPrice.toFixed(2)}</span>` : ''}
              ${it.discountPct ? `<span class="discount">-${it.discountPct}%</span>` : ''}
            </div>
            <div class="product-name">${esc(it.name || 'Sin nombre')}</div>
            ${it.variant ? `<div class="product-variant">${esc(it.variant)}</div>` : ''}
            ${it.meta ? `<div class="product-variant">${esc(it.meta)}</div>` : ''}
            ${it.status ? `<div class="product-status">${esc(it.status)}</div>` : ''}
            ${it.sku ? `<div class="product-sku">SKU: ${esc(it.sku)}</div>` : ''}
            ${it.outOfStock ? `<div class="sold-badge">🚫 Agotado en esta región</div>` : ''}
          </div>
          ${it.url ? `<a class="product-link" href="${it.url}" target="_blank" rel="noopener">Ver en SHEIN →</a>` : ''}
        </div>
      `).join('');
    }

    function copiarExcel() {
      if (!ultimo) return;
      const cab = ['#', 'SKU', 'Producto', 'Variante', 'Meta', 'Precio', 'Original', 'Descuento%', 'Status', 'URL'];
      const filas = (ultimo.items || []).map((it, i) => [
        i+1, it.sku, it.name, it.variant, it.meta,
        it.price, it.originalPrice || '', it.discountPct || '', it.status || '', it.url
      ]);
      const tsv = [cab, ...filas].map(r => r.map(x => String(x ?? '').replace(/\t/g, ' ')).join('\t')).join('\n');
      copiarTexto(tsv);
      toast('📋 Copiado. Pega en Excel con Ctrl+V');
    }

    function copiarItem(i) {
      if (!ultimo || !ultimo.items[i]) return;
      const it = ultimo.items[i];
      const txt = `#${i+1} | $${(it.price||0).toFixed(2)} | ${it.name} | SKU: ${it.sku} | ${it.url}`;
      copiarTexto(txt);
      toast('📋 Producto copiado');
    }

    function copiarTexto(txt) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).catch(() => fallback(txt));
      } else fallback(txt);
    }
    function fallback(txt) {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
    }

    function exportarJson() {
      if (!ultimo) return;
      const payload = {
        sharedBy: ultimo.sharedBy,
        itemsCount: ultimo.itemsCount,
        total: ultimo.total,
        items: ultimo.items,
        exportadoEn: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `shein_cart_${Date.now()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast('⬇️ JSON descargado');
    }

    function guardarHistorial(data) {
      const url = document.getElementById('url').value.trim();
      const h = JSON.parse(localStorage.getItem('sheinHist') || '[]');
      h.unshift({
        url,
        fecha: new Date().toLocaleString('es-ES'),
        sharedBy: data.sharedBy,
        items: data.itemsCount,
        total: data.total,
        data: data
      });
      localStorage.setItem('sheinHist', JSON.stringify(h.slice(0, 30)));
      renderHist();
    }
    function renderHist() {
      const h = JSON.parse(localStorage.getItem('sheinHist') || '[]');
      const box = document.getElementById('histList');
      const btnClear = document.getElementById('btnClearHist');
      btnClear.style.display = h.length > 0 ? 'inline-flex' : 'none';
      if (!h.length) {
        box.innerHTML = '<div class="hist-empty">📭 Sin consultas todavía.</div>';
        return;
      }
      box.innerHTML = '<div class="hist-list">' + h.map((x, i) => `
        <div class="hist-item" onclick="cargarHist(${i})">
          <span class="url">${esc(x.url)}</span>
          <span class="meta">${x.items} ítems · $${(x.total||0).toFixed(2)} · ${x.fecha}</span>
        </div>
      `).join('') + '</div>';
    }
    function cargarHist(i) {
      const h = JSON.parse(localStorage.getItem('sheinHist') || '[]');
      if (!h[i]) return;
      document.getElementById('url').value = h[i].url;
      ultimo = h[i].data;
      render(h[i].data);
      document.getElementById('btnExcel').disabled = false;
      document.getElementById('btnJson').disabled = false;
      setStatus('success', '📂 Cargado desde historial.');
    }
    function limpiarHistorial() {
      if (!confirm('¿Seguro que quieres borrar todo el historial? Esta acción no se puede deshacer.')) return;
      localStorage.removeItem('sheinHist');
      renderHist();
      toast('🗑️ Historial limpiado');
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    document.getElementById('url').addEventListener('keydown', e => {
      if (e.key === 'Enter') consultar();
    });

    renderHist();
  </script>
</body>
</html>
