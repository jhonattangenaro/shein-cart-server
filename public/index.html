<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHEIN Cart Viewer</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; min-height: 100vh; }
  header { text-align: center; padding: 30px 20px 10px; }
  header h1 { margin: 0 0 8px; font-size: 1.8rem; }
  header p { margin: 0; color: #666; font-size: 0.95rem; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .order-panel { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 20px; }
  .order-panel h2 { margin: 0 0 15px; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 10px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 0.85rem; color: #555; font-weight: 600; }
  .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
  .form-group input:focus, .form-group select:focus { border-color: #ff2d55; outline: none; }
  .search { display: flex; gap: 10px; margin-bottom: 20px; }
  .search input { flex: 1; padding: 14px 16px; border: 2px solid #ddd; border-radius: 12px; font-size: 1rem; outline: none; transition: border-color .2s; }
  .search input:focus { border-color: #ff2d55; }
  .search button { padding: 14px 28px; background: #ff2d55; color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; }
  .search button:hover { background: #e02549; }
  .search button:disabled { background: #ccc; cursor: not-allowed; }
  #status { margin-bottom: 20px; }
  .loading, .error, .ok { padding: 14px 18px; border-radius: 12px; font-size: .95rem; }
  .loading { background: #eef; color: #334; }
  .error { background: #fee; color: #a11; }
  .ok { background: #efe; color: #161; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #99f; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-left: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .summary { display: flex; gap: 24px; flex-wrap: wrap; padding: 18px 22px; background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 16px; font-size: 1.05rem; }
  .summary strong { color: #ff2d55; }
  .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .actions button { padding: 12px 20px; background: #fff; border: 2px solid #ddd; border-radius: 10px; cursor: pointer; font-size: .95rem; font-weight: 600; transition: all .2s; }
  .actions button:hover { border-color: #ff2d55; color: #ff2d55; }
  .btn-excel { background: #217346 !important; color: white !important; border: none !important; }
  .btn-excel:hover { background: #1a5c38 !important; color: white !important; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; flex-direction: column; gap: 8px; position: relative; }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 80px; }
  .idx { background: #f0f0f0; padding: 2px 8px; border-radius: 6px; font-size: .8rem; color: #666; }
  .price { font-weight: 700; color: #ff2d55; font-size: 1.1rem; }
  .old { text-decoration: line-through; color: #999; font-size: .85rem; }
  .disc { background: #ffe5eb; color: #ff2d55; padding: 2px 6px; border-radius: 6px; font-size: .75rem; font-weight: 600; }
  .card h3 { margin: 0; font-size: .95rem; line-height: 1.4; font-weight: 500; }
  .variant { margin: 0; color: #555; font-size: .85rem; }
  .meta { margin: 0; color: #999; font-size: .8rem; }
  .sku-text { font-size: 0.85rem; color: #0066cc; font-weight: bold; margin-top: 4px; background: #f0f8ff; padding: 4px 8px; border-radius: 6px; display: inline-block; }
  
  /* Estilo para el enlace nativo que mantiene la conexión */
  .btn-shein { margin-top: auto; color: #0066cc; text-decoration: none; font-size: .85rem; font-weight: 500; display: inline-block; }
  .btn-shein:hover { text-decoration: underline; }

  .btn-copy { position: absolute; top: 18px; right: 18px; background: #eef; border: 1px solid #ccf; color: #334; padding: 6px 12px; border-radius: 8px; font-size: .8rem; font-weight: 600; cursor: pointer; transition: all .2s; }
  .btn-copy:hover { background: #dde; }
  .btn-copy.ok { background: #efe; border-color: #cdc; color: #161; }
  #history { margin-top: 40px; }
  #history h2 { font-size: 1.2rem; }
  #historyList { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hist-btn { width: 100%; text-align: left; padding: 12px 16px; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .9rem; transition: border-color .2s; }
  .hist-btn:hover { border-color: #ff2d55; }
  .hist-btn small { color: #999; font-size: .8rem; }
  @media (max-width: 600px) { .search { flex-direction: column; } header h1 { font-size: 1.5rem; } .summary { gap: 12px; } }
</style>
</head>
<body>
<header>
  <h1>🛒 SHEIN Order Extractor</h1>
  <p>Extrae y formatea los datos para tu sistema</p>
</header>
<main>
  <section class="order-panel">
    <h2>Datos del Pedido</h2>
    <div class="form-grid">
      <div class="form-group"><label>ID Pedido</label><input type="text" id="inp-id" placeholder="Ej: S-0500"></div>
      <div class="form-group"><label>Cliente</label><input type="text" id="inp-cliente" placeholder="Nombre del cliente"></div>
      <div class="form-group"><label>Vendedor</label><input type="text" id="inp-vendedor" placeholder="Tu nombre"></div>
      <div class="form-group"><label>Fecha</label><input type="date" id="inp-fecha"></div>
    </div>
  </section>

  <section class="search">
    <input id="url" type="url" placeholder="Pega el enlace del carrito (onelink.shein.com...)" autocomplete="off">
    <button id="btn">Consultar</button>
  </section>

  <section id="status"></section>

  <section id="results" hidden>
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button id="copyAllExcel" class="btn-excel">📊 Copiar Todo (para Excel)</button>
      <button id="exportJson">⬇ Exportar JSON</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="history" hidden>
    <h2>Historial de consultas</h2>
    <ul id="historyList"></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const input = $('url'), btn = $('btn'), status = $('status');
const results = $('results'), summary = $('summary'), grid = $('grid');
const historySection = $('history'), historyList = $('historyList');
let lastData = null;

document.getElementById('inp-fecha').valueAsDate = new Date();

async function consultar(url) {
  if (!url) return;
  status.innerHTML = '<div class="loading">Consultando carrito en SHEIN... <span class="spinner"></span></div>';
  results.hidden = true;
  btn.disabled = true;
  try {
    const res = await fetch('/api/cart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!data.ok) {
      status.innerHTML = `<div class="error">❌ ${escapeHtml(data.error)}${data.detail ? `<br><small>${escapeHtml(data.detail)}</small>` : ''}</div>`;
      return;
    }
    lastData = data;
    status.innerHTML = `<div class="ok">✅ ${data.items.length} productos disponibles extraídos (${data.ms} ms)</div>`;
    render(data);
    addHistory(url, data);
  } catch (e) {
    status.innerHTML = `<div class="error">❌ Error de red: ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function getExcelRow(it) {
  return `1\t${it.name}\t${it.sku}\t${it.price.toFixed(2)}\t\t${it.price.toFixed(2)}\t${it.url}`;
}

function render(data) {
  results.hidden = false;
  summary.innerHTML = `
    <div><strong>${data.items.length}</strong> productos disponibles</div>
    <div>Total: <strong>$${data.total?.toFixed(2) ?? '—'}</strong></div>
    ${data.sharedBy ? `<div>Compartido por: ${escapeHtml(data.sharedBy)}</div>` : ''}
  `;

  grid.innerHTML = data.items.map((it, i) => `
    <article class="card">
      <button class="btn-copy" onclick="copiarFila(this, ${i})">📋 Copiar</button>
      <div class="card-head">
        <span class="idx">#${i + 1}</span>
        <span class="price">$${it.price.toFixed(2)}</span>
        ${it.originalPrice ? `<span class="old">$${it.originalPrice.toFixed(2)}</span>` : ''}
        ${it.discountPct ? `<span class="disc">-${it.discountPct}%</span>` : ''}
      </div>
      <h3>${escapeHtml(it.name)}</h3>
      ${it.variant ? `<p class="variant">${escapeHtml(it.variant)}</p>` : ''}
      <div class="sku-text">SKU: ${it.sku}</div>
      ${it.meta ? `<p class="meta">${escapeHtml(it.meta)}</p>` : ''}
      
      <!-- AQUÍ ESTÁ EL TRUCO: Usamos <a> con rel="opener" para no perder la conexión -->
      ${it.url ? `<a href="${escapeHtml(it.url)}#captura=${i}" target="_blank" rel="opener" class="btn-shein">Ver en SHEIN →</a>` : ''}
    </article>
  `).join('');
}

// Escuchar los títulos que envía la extensión desde SHEIN
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'SHEIN_TITULO' || !lastData) return;
  const idx = parseInt(e.data.index, 10);
  if (!lastData.items[idx]) return;

  lastData.items[idx].name = e.data.titulo;
  render(lastData);
  status.innerHTML = `<div class="ok">✅ Título actualizado (#${idx + 1}): ${escapeHtml(e.data.titulo)}</div>`;
});

window.copiarFila = async function(btnElement, index) {
  if (!lastData) return;
  const item = lastData.items[index];
  const text = getExcelRow(item);
  try {
    await navigator.clipboard.writeText(text);
    const orig = btnElement.textContent;
    btnElement.textContent = '¡Copiado!';
    btnElement.classList.add('ok');
    setTimeout(() => { btnElement.textContent = orig; btnElement.classList.remove('ok'); }, 1500);
  } catch (e) { alert('Error al copiar: ' + e.message); }
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addHistory(url, data) {
  const h = JSON.parse(localStorage.getItem('shein_history') || '[]');
  h.unshift({ url, ts: Date.now(), items: data.items.length, total: data.total, sharedBy: data.sharedBy });
  localStorage.setItem('shein_history', JSON.stringify(h.slice(0, 10)));
  renderHistory();
}

function renderHistory() {
  const h = JSON.parse(localStorage.getItem('shein_history') || '[]');
  if (!h.length) { historySection.hidden = true; return; }
  historySection.hidden = false;
  historyList.innerHTML = h.map(x => `
    <li>
      <button class="hist-btn" data-url="${escapeHtml(x.url)}">
        <span>${escapeHtml(x.sharedBy || 'Cliente')} · ${x.items} items · $${x.total?.toFixed(2) ?? '—'}</span>
        <small>${new Date(x.ts).toLocaleString()}</small>
      </button>
    </li>
  `).join('');
  historyList.querySelectorAll('.hist-btn').forEach(b => {
    b.onclick = () => { input.value = b.dataset.url; consultar(b.dataset.url); };
  });
}

btn.onclick = () => consultar(input.value.trim());
input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });

$('copyAllExcel').onclick = async () => {
  if (!lastData) return;
  const idPedido = document.getElementById('inp-id').value || 'N/A';
  const cliente = document.getElementById('inp-cliente').value || 'N/A';
  const vendedor = document.getElementById('inp-vendedor').value || 'N/A';
  const fecha = document.getElementById('inp-fecha').value || 'N/A';
  let text = `ID Pedido: ${idPedido} | Cliente: ${cliente} | Vendedor: ${vendedor} | Fecha: ${fecha}\n\n`;
  const headers = ['UND', 'Descripción', 'SKU', 'Costo ($)', 'Envio ($)', 'Venta ($)', 'Link Carrito'];
  text += headers.join('\t') + '\n';
  lastData.items.forEach(it => { text += getExcelRow(it) + '\n'; });
  try {
    await navigator.clipboard.writeText(text);
    $('copyAllExcel').textContent = '✅ ¡Copiado para Excel!';
    setTimeout(() => $('copyAllExcel').textContent = '📊 Copiar Todo (para Excel)', 2000);
  } catch (e) { alert('Error al copiar: ' + e.message); }
};

$('exportJson').onclick = () => {
  if (!lastData) return;
  const blob = new Blob([JSON.stringify(lastData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `carrito-${Date.now()}.json`;
  a.click();
};

renderHistory();
</script>
</body>
</html>
