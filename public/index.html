<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHEIN Cart Viewer</title>
<style>
  /* =========================================
     VARIABLES DE TEMA (Oscuro por defecto)
     ========================================= */
  :root {
    --bg-body: #121212;
    --bg-card: #1e1e1e;
    --bg-input: #2c2c2c;
    --bg-panel: #1e1e1e;
    --text-main: #e0e0e0;
    --text-muted: #999;
    --text-bright: #ffffff;
    --border-color: #333;
    --border-light: #444;
    --accent: #ff2d55;
    --accent-hover: #e02549;
    --status-loading-bg: #1a1a2e;
    --status-loading-text: #aab;
    --status-error-bg: #3a1a1a;
    --status-error-text: #f88;
    --status-ok-bg: #1b3624;
    --status-ok-text: #8f8;
    --sku-bg: #1a2a3a;
    --sku-text: #66b2ff;
    --btn-excel-bg: #217346;
    --btn-excel-hover: #1a5c38;
    --card-shadow: 0 1px 3px rgba(0,0,0,.3);
  }

  /* Variables para el Modo Claro */
  [data-theme="light"] {
    --bg-body: #f5f5f7;
    --bg-card: #ffffff;
    --bg-input: #ffffff;
    --bg-panel: #ffffff;
    --text-main: #1d1d1f;
    --text-muted: #666;
    --text-bright: #000000;
    --border-color: #ddd;
    --border-light: #eee;
    --accent: #ff2d55;
    --accent-hover: #e02549;
    --status-loading-bg: #eef;
    --status-loading-text: #334;
    --status-error-bg: #fee;
    --status-error-text: #a11;
    --status-ok-bg: #efe;
    --status-ok-text: #161;
    --sku-bg: #f0f8ff;
    --sku-text: #0066cc;
    --btn-excel-bg: #217346;
    --btn-excel-hover: #1a5c38;
    --card-shadow: 0 1px 3px rgba(0,0,0,.06);
  }

  /* =========================================
     ESTILOS GENERALES
     ========================================= */
  * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
  body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg-body); color: var(--text-main); min-height: 100vh; }
  
  header { text-align: center; padding: 30px 20px 10px; position: relative; }
  header h1 { margin: 0 0 8px; font-size: 1.8rem; color: var(--text-bright); }
  header p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }
  
  /* Botón de Tema */
  .theme-toggle {
    position: absolute;
    top: 30px;
    right: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: var(--card-shadow);
  }
  .theme-toggle:hover { border-color: var(--accent); }

  main { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* Buscador */
  .search { display: flex; gap: 10px; margin-bottom: 20px; }
  .search input { flex: 1; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 1rem; outline: none; background: var(--bg-input); color: var(--text-main); }
  .search input:focus { border-color: var(--accent); }
  .search button { padding: 14px 28px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .search button:hover { background: var(--accent-hover); }
  .search button:disabled { background: #555; cursor: not-allowed; }

  /* Estados y Mensajes */
  #status { margin-bottom: 20px; }
  .loading, .error, .ok { padding: 14px 18px; border-radius: 12px; font-size: .95rem; }
  .loading { background: var(--status-loading-bg); color: var(--status-loading-text); }
  .error { background: var(--status-error-bg); color: var(--status-error-text); }
  .ok { background: var(--status-ok-bg); color: var(--status-ok-text); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--status-loading-text); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-left: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Resultados */
  .summary { display: flex; gap: 24px; flex-wrap: wrap; padding: 18px 22px; background: var(--bg-card); border-radius: 14px; box-shadow: var(--card-shadow); margin-bottom: 16px; font-size: 1.05rem; }
  .summary strong { color: var(--accent); }
  
  .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .actions button { padding: 12px 20px; background: var(--bg-card); border: 2px solid var(--border-color); border-radius: 10px; cursor: pointer; font-size: .95rem; font-weight: 600; color: var(--text-main); }
  .actions button:hover { border-color: var(--accent); color: var(--accent); }
  .btn-excel { background: var(--btn-excel-bg) !important; color: #fff !important; border: none !important; }
  .btn-excel:hover { background: var(--btn-excel-hover) !important; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--bg-card); border-radius: 14px; padding: 18px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 8px; position: relative; border: 1px solid var(--border-color); }
  
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 80px; }
  .idx { background: var(--bg-input); padding: 2px 8px; border-radius: 6px; font-size: .8rem; color: var(--text-muted); }
  .price { font-weight: 700; color: var(--accent); font-size: 1.1rem; }
  .old { text-decoration: line-through; color: var(--text-muted); font-size: .85rem; }
  .disc { background: rgba(255, 45, 85, 0.15); color: var(--accent); padding: 2px 6px; border-radius: 6px; font-size: .75rem; font-weight: 600; }
  .card h3 { margin: 0; font-size: .95rem; line-height: 1.4; font-weight: 500; color: var(--text-bright); }
  .variant { margin: 0; color: var(--text-muted); font-size: .85rem; }
  .meta { margin: 0; color: var(--text-muted); font-size: .8rem; }
  .sku-text { font-size: 0.85rem; color: var(--sku-text); font-weight: bold; margin-top: 4px; background: var(--sku-bg); padding: 4px 8px; border-radius: 6px; display: inline-block; }
  
  .btn-shein { margin-top: auto; background: none; border: none; color: var(--sku-text); font-size: .85rem; font-weight: 500; cursor: pointer; padding: 0; text-align: left; font-family: inherit; }
  .btn-shein:hover { text-decoration: underline; }
  
  .btn-copy { position: absolute; top: 18px; right: 18px; background: var(--bg-input); border: 1px solid var(--border-light); color: var(--text-main); padding: 6px 12px; border-radius: 8px; font-size: .8rem; font-weight: 600; cursor: pointer; }
  .btn-copy:hover { border-color: var(--accent); }
  .btn-copy.ok { background: var(--status-ok-bg); color: var(--status-ok-text); border-color: var(--status-ok-text); }

  #history { margin-top: 40px; }
  #history h2 { font-size: 1.2rem; }
  #historyList { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hist-btn { width: 100%; text-align: left; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .9rem; color: var(--text-main); }
  .hist-btn:hover { border-color: var(--accent); }
  .hist-btn small { color: var(--text-muted); font-size: .8rem; }
  
  @media (max-width: 600px) { 
    .search { flex-direction: column; } 
    header h1 { font-size: 1.5rem; } 
    .summary { gap: 12px; } 
    .theme-toggle { position: relative; top: 0; right: 0; margin: 15px auto 0; justify-content: center; }
  }
</style>
</head>
<body>
<header>
  <h1>🛒 SHEIN Order Extractor</h1>
  <p>Extrae y formatea los datos para tu sistema</p>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
    <span id="themeIcon">🌙</span> <span id="themeText">Modo Oscuro</span>
  </button>
</header>
<main>
  <section class="search">
    <input id="url" type="url" placeholder="Pega el enlace del carrito (onelink.shein.com...)" autocomplete="off">
    <button id="btn">Consultar</button>
  </section>

  <section id="status"></section>

  <section id="results" hidden>
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button id="copyAllExcel" class="btn-excel">📊 Copiar Todo (para Excel)</button>
      <button id="exportJson">⬇ Exportar JSON</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="history" hidden>
    <h2>Historial de consultas</h2>
    <ul id="historyList"></ul>
  </section>
</main>

<script>
/* =========================================
   GESTIÓN DEL TEMA (Oscuro/Claro)
   ========================================= */
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const themeText = document.getElementById('themeText');
let currentTheme = localStorage.getItem('shein_theme') || 'dark';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  if (theme === 'dark') {
    themeIcon.textContent = '🌙';
    themeText.textContent = 'Modo Oscuro';
  } else {
    themeIcon.textContent = '☀️';
    themeText.textContent = 'Modo Claro';
  }
  localStorage.setItem('shein_theme', theme);
}

function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(currentTheme);
}

applyTheme(currentTheme);

/* =========================================
   LÓGICA DE LA APLICACIÓN
   ========================================= */
const $ = (id) => document.getElementById(id);
const input = $('url'), btn = $('btn'), status = $('status');
const results = $('results'), summary = $('summary'), grid = $('grid');
const historySection = $('history'), historyList = $('historyList');
let lastData = null;
let lastClickedIndex = null;
let currentLoadedUrl = ''; // Guarda la URL del carrito actual para actualizar el historial

async function consultar(url) {
  if (!url) return;
  status.innerHTML = '<div class="loading">Consultando carrito en SHEIN... <span class="spinner"></span></div>';
  results.hidden = true;
  btn.disabled = true;
  try {
    const res = await fetch('/api/cart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!data.ok) {
      status.innerHTML = `<div class="error">❌ ${escapeHtml(data.error)}${data.detail ? `<br><small>${escapeHtml(data.detail)}</small>` : ''}</div>`;
      return;
    }
    lastData = data;
    currentLoadedUrl = url;
    status.innerHTML = `<div class="ok">✅ ${data.items.length} productos disponibles extraídos (${data.ms} ms)</div>`;
    render(data);
    addHistory(url, data);
  } catch (e) {
    status.innerHTML = `<div class="error">❌ Error de red: ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function getExcelRow(it) {
  return `1\t${it.name}\t${it.sku}\t${it.price.toFixed(2)}\t\t${it.price.toFixed(2)}\t${it.url}`;
}

function render(data) {
  results.hidden = false;
  summary.innerHTML = `
    <div><strong>${data.items.length}</strong> productos disponibles</div>
    <div>Total: <strong>$${data.total?.toFixed(2) ?? '—'}</strong></div>
    ${data.sharedBy ? `<div>Compartido por: ${escapeHtml(data.sharedBy)}</div>` : ''}
  `;

  grid.innerHTML = data.items.map((it, i) => `
    <article class="card">
      <button class="btn-copy" onclick="copiarFila(this, ${i})">📋 Copiar</button>
      <div class="card-head">
        <span class="idx">#${i + 1}</span>
        <span class="price">$${it.price.toFixed(2)}</span>
        ${it.originalPrice ? `<span class="old">$${it.originalPrice.toFixed(2)}</span>` : ''}
        ${it.discountPct ? `<span class="disc">-${it.discountPct}%</span>` : ''}
      </div>
      <h3>${escapeHtml(it.name)}</h3>
      ${it.variant ? `<p class="variant">${escapeHtml(it.variant)}</p>` : ''}
      <div class="sku-text">SKU: ${it.sku}</div>
      ${it.meta ? `<p class="meta">${escapeHtml(it.meta)}</p>` : ''}
      <button class="btn-shein" data-index="${i}" data-url="${escapeHtml(it.url)}">Ver en SHEIN →</button>
    </article>
  `).join('');
}

grid.addEventListener('click', (e) => {
  const btnShein = e.target.closest('.btn-shein');
  if (!btnShein || !lastData) return;
  
  lastClickedIndex = parseInt(btnShein.dataset.index, 10);
  const url = btnShein.dataset.url;
  window.open(url);
});

window.addEventListener('message', (e) => {
  if (!e.data) return;

  if (e.data.type === 'SHEIN_ASK_INDEX') {
    if (lastClickedIndex !== null) {
      e.source.postMessage({ type: 'SHEIN_HERE_IS_INDEX', index: lastClickedIndex }, '*');
    }
    return;
  }

  if (e.data.type === 'SHEIN_TITULO' && lastData) {
    const idx = parseInt(e.data.index, 10);
    if (!lastData.items[idx]) return;

    // Actualizar el título en la vista actual
    lastData.items[idx].name = e.data.titulo;
    render(lastData);
    
    // ¡IMPORTANTE! Actualizar también en el historial guardado
    updateCurrentHistory(); 
    
    status.innerHTML = `<div class="ok">✅ Título actualizado (#${idx + 1}): ${escapeHtml(e.data.titulo)}</div>`;
  }
});

window.copiarFila = async function(btnElement, index) {
  if (!lastData) return;
  const item = lastData.items[index];
  const text = getExcelRow(item);
  try {
    await navigator.clipboard.writeText(text);
    const orig = btnElement.textContent;
    btnElement.textContent = '¡Copiado!';
    btnElement.classList.add('ok');
    setTimeout(() => { btnElement.textContent = orig; btnElement.classList.remove('ok'); }, 1500);
  } catch (e) { alert('Error al copiar: ' + e.message); }
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================
   HISTORIAL (Guardando los datos completos)
   ========================================= */
function addHistory(url, data) {
  const h = JSON.parse(localStorage.getItem('shein_history') || '[]');
  // Filtramos si ya existía ese mismo enlace para no duplicar
  const filtered = h.filter(x => x.url !== url);
  
  // Guardamos una copia completa de los datos (data) y el timestamp
  filtered.unshift({ url, ts: Date.now(), data: JSON.parse(JSON.stringify(data)) });
  localStorage.setItem('shein_history', JSON.stringify(filtered.slice(0, 10)));
  renderHistory();
}

function updateCurrentHistory() {
  if (!currentLoadedUrl) return;
  const h = JSON.parse(localStorage.getItem('shein_history') || '[]');
  const idx = h.findIndex(x => x.url === currentLoadedUrl);
  if (idx !== -1) {
    // Actualizamos el historial con el estado actual de los datos
    h[idx].data = JSON.parse(JSON.stringify(lastData));
    localStorage.setItem('shein_history', JSON.stringify(h));
  }
}

function renderHistory() {
  const h = JSON.parse(localStorage.getItem('shein_history') || '[]');
  if (!h.length) { historySection.hidden = true; return; }
  historySection.hidden = false;
  
  historyList.innerHTML = h.map((x, i) => {
    // Compatibilidad por si hay historial viejo que no guardaba .data
    const count = x.data ? x.data.items.length : x.items;
    const tot = x.data ? x.data.total : x.total;
    const shared = x.data ? x.data.sharedBy : x.sharedBy;
    
    return `
      <li>
        <button class="hist-btn" onclick="loadHistory(${i})">
          <span>${escapeHtml(shared || 'Cliente')} · ${count} items · $${tot?.toFixed(2) ?? '—'}</span>
          <small>${new Date(x.ts).toLocaleString()}</small>
        </button>
      </li>
    `;
  }).join('');
}

window.loadHistory = function(index) {
  const h = JSON.parse(localStorage.getItem('shein_history') || '[]');
  const item = h[index];
  if (!item) return;
  
  if (item.data) {
    // Cargar instantáneamente desde el historial (con los títulos modificados)
    input.value = item.url;
    currentLoadedUrl = item.url;
    lastData = item.data;
    status.innerHTML = `<div class="ok">✅ Carrito cargado desde el historial (con títulos guardados)</div>`;
    render(lastData);
  } else {
    // Si es un historial del código viejo, volvemos a consultar
    input.value = item.url;
    consultar(item.url);
  }
};

/* =========================================
   EVENTOS PRINCIPALES
   ========================================= */
btn.onclick = () => consultar(input.value.trim());
input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });

$('copyAllExcel').onclick = async () => {
  if (!lastData) return;
  let text = '';
  const headers = ['UND', 'Descripción', 'SKU', 'Costo ($)', 'Envio ($)', 'Venta ($)', 'Link Carrito'];
  text += headers.join('\t') + '\n';
  lastData.items.forEach(it => { text += getExcelRow(it) + '\n'; });

  try {
    await navigator.clipboard.writeText(text);
    $('copyAllExcel').textContent = '✅ ¡Copiado para Excel!';
    setTimeout(() => $('copyAllExcel').textContent = '📊 Copiar Todo (para Excel)', 2000);
  } catch (e) { alert('Error al copiar: ' + e.message); }
};

$('exportJson').onclick = () => {
  if (!lastData) return;
  const blob = new Blob([JSON.stringify(lastData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `carrito-${Date.now()}.json`;
  a.click();
};

renderHistory();
</script>
</body>
</html>
